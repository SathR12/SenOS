[project]
name = "senos"
version = "0.1.0"
description = "Natural-language user intent driving Linux resource policies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
senos = "senos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
